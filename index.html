<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Search</title>

  <!-- ----------------------------------------------------------------------------------------------------- -->

  <!-- Tailwind CSS para utilitários de estilo rápidos -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Biblioteca de ícones Lucide -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <!-- SDK do Element para configuração dinâmica -->
  <script src="/_sdk/element_sdk.js"></script>

  <!-- Fontes do Google -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Space+Mono:wght@700&amp;display=swap" rel="stylesheet">

  <!-- ----------------------------------------------------------------------------------------------------- -->

  <style>
    /* Animação de entrada com fade e movimento para cima */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animação de pulso para indicadores de carregamento */
    @keyframes pulse-ring {
      0% {
        transform: scale(.8);
        opacity: .5;
      }
      50% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(.8);
        opacity: .5;
      }
    }

    .fade-up {
      animation: fadeUp .5s ease forwards;
    }

    .pulse-ring {
      animation: pulse-ring 1.2s ease infinite;
    }

    .glow-border {
      box-shadow: 0 0 0 1px rgba(56,189,248,.15), 0 0 30px -10px rgba(56,189,248,.2);
    }

    .btn-glow:hover {
      box-shadow: 0 0 20px rgba(56,189,248,.35);
    }

    body {
      font-family: 'DM Sans', sans-serif;
    }
  </style>

  <style>
    /* Define box sizing para todo o documento */
    body {
      box-sizing: border-box;
    }
  </style>

  <!-- ----------------------------------------------------------------------------------------------------- -->

  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

  <!-- ----------------------------------------------------------------------------------------------------- -->

</head>

<body class="h-full">
  <main id="app-wrapper" class="h-full w-full overflow-auto flex items-center justify-center p-4" style="background-color:#0f172a">
    <div class="w-full max-w-lg fade-up">
      <!-- Cabeçalho da aplicação -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 rounded-full px-4 py-1.5 mb-5" style="background:rgba(56,189,248,.1); border:1px solid rgba(56,189,248,.2)">
          <i data-lucide="search" style="width:14px;height:14px;color:#38bdf8"></i>
          <span style="color:#38bdf8; font-size:13px; font-weight:500">Pesquisa Inteligente</span>
        </div>

        <h1 id="heading" style="font-family:'Space Mono',monospace; color:#f1f5f9; font-size:32px; font-weight:700; line-height:1.2">
          Buscar Produtos
        </h1>
        <p id="subtitle" style="color:#94a3b8; margin-top:8px; font-size:15px">
          Digite um tema e descubra o produto ideal
        </p>
      </div>

      <!-- ----------------------------------------------------------------------------------------------------- -->

      <!-- Cartão de busca -->
      <div class="rounded-2xl p-6 glow-border" style="background:#1e293b">
        <form id="search-form" class="flex gap-3">
          <label for="theme-input" class="sr-only">Tema do produto</label>
          <input
            id="theme-input"
            type="text"
            placeholder="Ex: tecnologia, moda, esporte…"
            class="flex-1 rounded-xl px-4 py-3 text-sm outline-none transition-all focus:ring-2"
            style="background:#0f172a; color:#f1f5f9; border:1px solid rgba(56,189,248,.15); --tw-ring-color:#38bdf8"
          >
          <button
            id="search-btn"
            type="submit"
            class="rounded-xl px-5 py-3 font-medium text-sm transition-all btn-glow flex items-center gap-2 shrink-0"
            style="background:#38bdf8; color:#0f172a"
          >
            <i data-lucide="arrow-right" style="width:16px;height:16px"></i>
            <span id="btn-label">Buscar</span>
          </button>
        </form>

        <!-- ----------------------------------------------------------------------------------------------------- -->

        <!-- Área de resultados -->
        <div id="results" class="mt-5 hidden"></div>
      </div>
    </div>
  </main>

  <!-- ----------------------------------------------------------------------------------------------------- -->

  <script>
    // Inicializa os ícones do Lucide no HTML
    lucide.createIcons();

    // Configuração padrão do app
    const defaultConfig = {
      heading_text: 'Buscar Produtos',
      subtitle_text: 'Digite um tema e descubra o produto ideal',
      button_text: 'Buscar',
      background_color: '#0f172a',
      card_color: '#1e293b',
      accent_color: '#38bdf8',
      text_color: '#f1f5f9',
      muted_color: '#94a3b8',
      font_family: 'DM Sans',
      font_size: 15
    };

    // Aplica valores de configuração aos elementos da página
    function applyConfig(c) {
      const el = (id) => document.getElementById(id);
      el('heading').textContent = c.heading_text || defaultConfig.heading_text;
      el('subtitle').textContent = c.subtitle_text || defaultConfig.subtitle_text;
      el('btn-label').textContent = c.button_text || defaultConfig.button_text;

      const bg = c.background_color || defaultConfig.background_color;
      const card = c.card_color || defaultConfig.card_color;
      const accent = c.accent_color || defaultConfig.accent_color;
      const txt = c.text_color || defaultConfig.text_color;
      const muted = c.muted_color || defaultConfig.muted_color;
      const font = c.font_family || defaultConfig.font_family;
      const fs = c.font_size || defaultConfig.font_size;

      el('app-wrapper').style.backgroundColor = bg;
      document.querySelectorAll('.glow-border').forEach(e => e.style.backgroundColor = card);
      el('search-btn').style.backgroundColor = accent;
      el('search-btn').style.color = bg;
      el('heading').style.color = txt;
      el('subtitle').style.color = muted;
      el('theme-input').style.backgroundColor = bg;
      el('theme-input').style.color = txt;
      document.body.style.fontFamily = `${font}, sans-serif`;
      el('subtitle').style.fontSize = `${fs}px`;
    }

    // Cria um objeto de capacidade para o SDK do Element
    function makeCapability(key) {
      return {
        get: () => (window.elementSdk.config || defaultConfig)[key] || defaultConfig[key],
        set: (v) => { window.elementSdk.setConfig({ [key]: v }); }
      };
    }

    // Inicializa o SDK do Element com as configurações e edições disponíveis
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (c) => applyConfig(c),
      mapToCapabilities: (c) => ({
        recolorables: [
          makeCapability('background_color'),
          makeCapability('card_color'),
          makeCapability('text_color'),
          makeCapability('accent_color'),
          makeCapability('muted_color')
        ],
        borderables: [],
        fontEditable: makeCapability('font_family'),
        fontSizeable: makeCapability('font_size')
      }),
      mapToEditPanelValues: (c) => new Map([
        ['heading_text', c.heading_text || defaultConfig.heading_text],
        ['subtitle_text', c.subtitle_text || defaultConfig.subtitle_text],
        ['button_text', c.button_text || defaultConfig.button_text]
      ])
    });

    // --- Lógica de busca ---
    const form = document.getElementById('search-form');
    const input = document.getElementById('theme-input');
    const results = document.getElementById('results');
    const btn = document.getElementById('search-btn');

    // Função para exibir os resultados ou mensagens na tela
    function showResults(html) {
      results.innerHTML = html;
      results.classList.remove('hidden');
      results.querySelector('.result-card')?.classList.add('fade-up');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const tema = input.value.trim();
      if (!tema) {
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.style.opacity = '.6';

      showResults(`
        <div class="result-card flex items-center justify-center gap-3 py-8" style="color:#94a3b8">
          <div class="w-5 h-5 rounded-full pulse-ring" style="background:#38bdf8"></div>
          <span class="text-sm">Buscando produtos…</span>
        </div>
      `);

      try {
        const res = await fetch('https://pesquisa-de-produto.onrender.com/produtos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tema })
        });

        if (!res.ok) throw new Error(`Erro ${res.status}`);
        const data = await res.json();

        if (!data || (Array.isArray(data) && data.length === 0)) {
          showResults(`
            <div class="result-card rounded-xl p-5 text-center" style="background:rgba(251,191,36,.08); border:1px solid rgba(251,191,36,.2)">
              <p style="color:#fbbf24; font-size:14px">Nenhum produto encontrado para "<strong>${tema}</strong>"</p>
            </div>
          `);
        } else {
          const items = Array.isArray(data) ? data : [data];
          const cards = items.map(p => `
            <div class="result-card rounded-xl p-5 flex items-center gap-4" style="background:#0f172a; border:1px solid rgba(56,189,248,.1)">
              <div class="w-11 h-11 rounded-lg flex items-center justify-center shrink-0" style="background:rgba(56,189,248,.12)">
                <i data-lucide="package" style="width:20px;height:20px;color:#38bdf8"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm truncate" style="color:#f1f5f9">${p.nome || p.name || 'Produto'}</p>
                ${p.descricao || p.description ? `<p class="text-xs mt-0.5 truncate" style="color:#94a3b8">${p.descricao || p.description}</p>` : ''}
              </div>
              ${p.preco != null || p.price != null ? `<span class="font-bold text-sm shrink-0" style="color:#38bdf8">R$ ${Number(p.preco ?? p.price).toFixed(2)}</span>` : ''}
            </div>
          `).join('');

          showResults(`<div class="space-y-3">${cards}</div>`);
          lucide.createIcons();
        }
      } catch (err) {
        showResults(`
          <div class="result-card rounded-xl p-5 text-center" style="background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2)">
            <p style="color:#f87171; font-size:14px">Não foi possível buscar os produtos. Tente novamente.</p>
          </div>
        `);
      } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    });
  </script>

</body>
</html>
